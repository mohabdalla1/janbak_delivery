name: janbak_delivery
description: Professional Flutter Delivery Platform (Janbak | جنبك)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.1
  image: ^4.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  
  # State Management & DI
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Firebase Core & Services
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6
  firebase_crashlytics: ^4.1.5
  
  # Functional Programming & Utilities
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  
  # UI & Theme
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/