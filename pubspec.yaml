name: janbak_delivery
description: "A professional delivery and services application - Janbak"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الخرائط المجانية ومفتوحة المصدر
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # إدارة الحالة والربط
  provider: ^6.1.2

  # جلب الخطوط من جوجل
  google_fonts: ^6.2.1

  # حزم فايربيس الأساسية للتطبيق
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png